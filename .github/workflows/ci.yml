name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pathweaver.Core is deliberately free of UnityEngine references, so the whole
# simulation builds and tests on a plain Linux runner with no Unity licence.
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Pathweaver.slnx

      - name: Verify formatting
        run: dotnet format Pathweaver.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pathweaver.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test Pathweaver.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage
          if-no-files-found: warn
